# CI â€” Suivi Engagement Service (3 Feign clients + MySQL + Java 21)
name: CI â€” Suivi Engagement Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/suivi-engagement-service/**'
      - '.github/workflows/ci-suivi-engagement-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/suivi-engagement-service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Suivi Engagement Service"
      service-path: "backend/suivi-engagement-service"
      image-name: "fakarni-suivi-engagement-service"
      sonar-project-key: "fakarni-suivi-engagement-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}