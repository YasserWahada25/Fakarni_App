# CI - Session Service (WebSocket + WebRTC + MySQL)
name: "CI - Session Service"

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/session-service/**'
      - '.github/workflows/ci-session-service.yml'
      - '.github/workflows/ci-reusable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/session-service/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du declenchement manuel"
        required: false
        default: "Test manuel"

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Session Service"
      service-path: "backend/session-service"
      image-name: "fakarni-session-service"
      sonar-project-key: "fakarni-session-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}