# CI â€” Chat Service (WebSocket + STOMP + MongoDB)
name: CI â€” Chat Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Chat_Service/**'
      - '.github/workflows/ci-chat-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Chat_Service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Chat Service"
      service-path: "backend/Chat_Service"
      image-name: "fakarni-chat-service"
      sonar-project-key: "fakarni-chat-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}