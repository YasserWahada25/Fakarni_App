# CI â€” Dossier Medical Service (Dossiers patients + MySQL)
name: CI â€” Dossier Medical Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Dossier_Medical-service/**'
      - '.github/workflows/ci-dossier-medical-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dossier_Medical-service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Dossier Medical Service"
      service-path: "backend/Dossier_Medical-service"
      image-name: "fakarni-dossier-medical-service"
      sonar-project-key: "fakarni-dossier-medical-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}