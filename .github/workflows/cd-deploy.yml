# ============================================================
# WORKFLOW CD - FakarniApp
# Deploy sur Azure Web App for Containers depuis Docker Hub
# Region: swedencentral (autorisee par policy ESPRIT)
# Plan: fakarni-plan (B1 Linux)
# ============================================================
name: "CD - Deploy to Azure Web App"

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Nom de la webapp Azure (ex: fakarni-eureka)"
      image-name:
        required: true
        type: string
        description: "Nom de l'image Docker Hub (ex: fakarni-eureka-service)"
      image-tag:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: production
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AZURE_CREDENTIALS:
        required: true
      AZURE_RESOURCE_GROUP:
        required: true

  workflow_dispatch:
    inputs:
      service-name:
        description: "Nom du service Azure (ex: fakarni-eureka)"
        required: true
        type: choice
        options:
          - fakarni-eureka
          - fakarni-gateway
          - fakarni-user
          - fakarni-chat
          - fakarni-meeting
          - fakarni-tracking
          - fakarni-geofencing
          - fakarni-activite
          - fakarni-detection
          - fakarni-dossier
          - fakarni-event
          - fakarni-group
          - fakarni-post
          - fakarni-session
          - fakarni-suivi
          - fakarni-flask-ia
      image-name:
        description: "Image Docker Hub (ex: fakarni-eureka-service)"
        required: true
      image-tag:
        description: "Tag (defaut: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    name: "Deploy ${{ inputs.service-name }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: "Login Azure"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Configure Docker Hub credentials on Web App"
        run: |
          az webapp config container set \
            --name "${{ inputs.service-name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}" \
            --docker-registry-server-url "https://index.docker.io" \
            --docker-registry-server-user "${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-registry-server-password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: "Restart Web App to pull new image"
        run: |
          az webapp restart \
            --name "${{ inputs.service-name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: "Wait for app to start (60s)"
        run: sleep 60

      - name: "Health check"
        id: health
        run: |
          URL=$(az webapp show \
            --name "${{ inputs.service-name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "defaultHostName" --output tsv)
          echo "app-url=https://$URL" >> $GITHUB_OUTPUT
          # Test health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://$URL/actuator/health" || echo "000")
          echo "http-code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "App URL: https://$URL"
          echo "Health check HTTP code: $HTTP_CODE"

      - name: "Summary"
        run: |
          echo "### Deploy OK - ${{ inputs.service-name }}" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.health.outputs.app-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | HTTP ${{ steps.health.outputs.http-code }} |" >> $GITHUB_STEP_SUMMARY
