# CI â€” Geofencing Service (Zones GPS + Twilio + Gmail + MySQL)
name: CI â€” Geofencing Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Geofencing-Service/**'
      - '.github/workflows/ci-geofencing-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Geofencing-Service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Geofencing Service"
      service-path: "backend/Geofencing-Service"
      image-name: "fakarni-geofencing-service"
      sonar-project-key: "fakarni-geofencing-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}