# CI â€” Activite Educative Service (Jeux cognitifs + MySQL)
name: CI â€” Activite Educative Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/activite-educative-service/**'
      - '.github/workflows/ci-activite-educative-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/activite-educative-service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Activite Educative Service"
      service-path: "backend/activite-educative-service"
      image-name: "fakarni-activite-educative-service"
      sonar-project-key: "fakarni-activite-educative-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}