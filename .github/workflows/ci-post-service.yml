# CI â€” Post Service (RÃ©seau social interne + JWT + MySQL)
name: CI â€” Post Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Post-Service/**'
      - '.github/workflows/ci-post-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Post-Service/**'

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Post Service"
      service-path: "backend/Post-Service"
      image-name: "fakarni-post-service"
      sonar-project-key: "fakarni-post-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APPS_ENV: ${{ secrets.CONTAINER_APPS_ENV }}