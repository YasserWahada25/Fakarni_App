name: "CI - Frontend Angular"

on:
  push:
    paths:
      - 'frontend/**'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'frontend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: "Build Angular + Docker Push"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        working-directory: frontend
        run: npm ci

      - name: "Build Angular (production)"
        working-directory: frontend
        run: npm run build -- --configuration=production
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: "Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set image tag"
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: "Build & Push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:${{ steps.tag.outputs.tag }}

      - name: "Deploy to Azure Web App"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Update Azure frontend image"
        run: |
          az webapp config container set \
            --name "fakarni-frontend" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:${{ steps.tag.outputs.tag }}" \
            --docker-registry-server-url "https://index.docker.io" \
            --docker-registry-server-user "${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-registry-server-password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: "Restart Web App"
        run: |
          az webapp restart \
            --name "fakarni-frontend" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: "Build Summary"
        run: |
          echo "### Frontend Deploy OK" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://fakarni-frontend.azurewebsites.net |" >> $GITHUB_STEP_SUMMARY
