spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

spring.datasource.url=jdbc:h2:mem:geofencing_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mail (valeurs fictives pour les tests — aucun email n'est envoye)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Twilio (valeurs fictives — les noms de proprietes exacts utilises par @Value)
twilio.account-sid=ACtest00000000000000000000000000000
twilio.auth-token=test0000000000000000000000000000
twilio.from-number=+10000000000
