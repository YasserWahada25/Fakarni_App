apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: fakarni-prod
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8090
      targetPort: 8090
  # LoadBalancer expose la Gateway publiquement — point d'entrée unique
  type: LoadBalancer
