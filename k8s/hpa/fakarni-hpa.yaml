# ============================================================
# HorizontalPodAutoscaler — Services critiques FakarniApp
# Scale automatiquement selon la charge CPU
# ============================================================

# Gateway — point d'entrée, scale en premier
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-gateway-service
  namespace: fakarni-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
