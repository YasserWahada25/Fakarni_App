apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-ia-service
  namespace: fakarni-prod
  labels:
    app: flask-ia-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-ia-service
  template:
    metadata:
      labels:
        app: flask-ia-service
    spec:
      containers:
        - name: flask-ia-service
          image: fakarnicr.azurecr.io/fakarni-flask-ia-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          # TensorFlow nécessite plus de ressources
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 30
