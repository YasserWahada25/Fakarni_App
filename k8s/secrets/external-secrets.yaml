# ============================================================
# External Secrets — FakarniApp
# Synchronise les secrets depuis Azure Key Vault vers K8s
# Prérequis : External Secrets Operator installé sur AKS
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# ============================================================

# SecretStore — connexion à Azure Key Vault via Managed Identity AKS
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault-store
spec:
  provider:
    azurekv:
      # Remplacer par l'URL de votre Key Vault Azure
      vaultUrl: "https://fakarni-keyvault.vault.azure.net/"
      authType: ManagedIdentity
---
# ExternalSecret — tous les secrets partagés FakarniApp
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fakarni-secrets
  namespace: fakarni-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: fakarni-secrets          # Nom du Secret K8s créé automatiquement
    creationPolicy: Owner
  data:
    # JWT
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    # Mail User-Service
    - secretKey: MAIL_USERNAME_USER
      remoteRef:
        key: mail-username-user
    - secretKey: MAIL_PASSWORD_USER
      remoteRef:
        key: mail-password-user
    # Mail Geofencing-Service
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: mail-username-geofencing
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: mail-password-geofencing
    # Mailtrap (Event-Service)
    - secretKey: MAILTRAP_USERNAME
      remoteRef:
        key: mailtrap-username
    - secretKey: MAILTRAP_PASSWORD
      remoteRef:
        key: mailtrap-password
    # Google OAuth2
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-client-id
    # Facebook OAuth2
    - secretKey: FACEBOOK_APP_ID
      remoteRef:
        key: facebook-app-id
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: facebook-app-secret
    # Twilio
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: twilio-account-sid
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: twilio-auth-token
    - secretKey: TWILIO_FROM_NUMBER
      remoteRef:
        key: twilio-from-number
    # MongoDB (Azure Cosmos DB)
    - secretKey: MONGODB_URI
      remoteRef:
        key: mongodb-uri
    # MySQL (Azure Database for MySQL Flexible Server)
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: mysql-password
---
# Copier le même ExternalSecret pour le namespace staging
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fakarni-secrets
  namespace: fakarni-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: fakarni-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    - secretKey: MAIL_USERNAME_USER
      remoteRef:
        key: mail-username-user
    - secretKey: MAIL_PASSWORD_USER
      remoteRef:
        key: mail-password-user
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: mail-username-geofencing
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: mail-password-geofencing
    - secretKey: MAILTRAP_USERNAME
      remoteRef:
        key: mailtrap-username
    - secretKey: MAILTRAP_PASSWORD
      remoteRef:
        key: mailtrap-password
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-client-id
    - secretKey: FACEBOOK_APP_ID
      remoteRef:
        key: facebook-app-id
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: facebook-app-secret
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: twilio-account-sid
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: twilio-auth-token
    - secretKey: TWILIO_FROM_NUMBER
      remoteRef:
        key: twilio-from-number
    - secretKey: MONGODB_URI
      remoteRef:
        key: mongodb-uri
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: mysql-password
